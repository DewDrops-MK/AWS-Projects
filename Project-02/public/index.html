<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Profile App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Employee Profile</div>
        <div class="nav-links">
            <a href="#" onclick="showDashboard()">Dashboard</a>
            <a href="#" onclick="showEmployees()">Employees</a>
            <a href="#" onclick="showAddEmployee()">Add Employee</a>
        </div>
    </nav>

    <div id="dashboard" class="page">
        <h1>Dashboard</h1>
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Employees</h3>
                <div class="stat-number" id="totalEmployees">0</div>
            </div>
            <div class="stat-card">
                <h3>Departments</h3>
                <div class="stat-number" id="totalDepartments">0</div>
            </div>
            <div class="stat-card">
                <h3>Locations</h3>
                <div class="stat-number" id="totalLocations">0</div>
            </div>
        </div>
        <div class="recent-section">
            <h2>Recent Employees</h2>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Job Title</th>
                        <th>Department</th>
                    </tr>
                </thead>
                <tbody id="recentEmployees"></tbody>
            </table>
        </div>
    </div>

    <div id="employees" class="page" style="display: none;">
        <div class="page-header">
            <h1>Employees</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by name..." onkeyup="searchEmployees()">
                <button onclick="clearSearch()">Clear</button>
            </div>
        </div>
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Job Title</th>
                    <th>Department</th>
                    <th>Location</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="employeeList"></tbody>
        </table>
    </div>

    <div id="addEmployee" class="page" style="display: none;">
        <h1>Add Employee</h1>
        <form id="addForm" onsubmit="addEmployee(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label>First Name *</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="form-group">
                    <label>Last Name *</label>
                    <input type="text" id="lastName" required>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="phone">
                </div>
                <div class="form-group">
                    <label>Job Title</label>
                    <input type="text" id="jobTitle">
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <input type="text" id="department">
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="location">
                </div>
                <div class="form-group">
                    <label>Joining Date</label>
                    <input type="date" id="joiningDate">
                </div>
            </div>
            <div class="form-actions">
                <button type="submit">Add Employee</button>
                <button type="button" onclick="showEmployees()">Cancel</button>
            </div>
        </form>
    </div>

    <div id="editEmployee" class="page" style="display: none;">
        <h1>Edit Employee</h1>
        <form id="editForm" onsubmit="updateEmployee(event)">
            <input type="hidden" id="editId">
            <div class="form-grid">
                <div class="form-group">
                    <label>First Name *</label>
                    <input type="text" id="editFirstName" required>
                </div>
                <div class="form-group">
                    <label>Last Name *</label>
                    <input type="text" id="editLastName" required>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="editEmail" required>
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="editPhone">
                </div>
                <div class="form-group">
                    <label>Job Title</label>
                    <input type="text" id="editJobTitle">
                </div>
                <div class="form-group">
                    <label>Department</label>
                    <input type="text" id="editDepartment">
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="editLocation">
                </div>
                <div class="form-group">
                    <label>Joining Date</label>
                    <input type="date" id="editJoiningDate">
                </div>
            </div>
            <div class="form-actions">
                <button type="submit">Update Employee</button>
                <button type="button" onclick="showEmployees()">Cancel</button>
            </div>
        </form>
    </div>

    <div id="employeeDetails" class="page" style="display: none;">
        <h1>Employee Details</h1>
        <div class="details-card" id="detailsContent"></div>
        <div class="form-actions">
            <button onclick="showEmployees()">Back to List</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
